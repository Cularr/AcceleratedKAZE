name: Build and Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      - run: dotnet test AcceleratedKAZE.Tests/AcceleratedKAZE.Tests.csproj -c Release

      - run: dotnet test AcceleratedKAZE.Tests/AcceleratedKAZE.Tests.csproj -c Release --no-build
        env:
          DOTNET_EnableAVX: 0

  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install opencv-contrib-python-headless==4.12.0.88

      - run: python AcceleratedKAZE.Tests/Reference/generate.py

      - run: dotnet test AcceleratedKAZE.Tests/AcceleratedKAZE.Tests.csproj -c Release

      - run: dotnet test AcceleratedKAZE.Tests/AcceleratedKAZE.Tests.csproj -c Release --no-build
        env:
          DOTNET_EnableAVX: 0

  test-alpine:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/dotnet/sdk:11.0-alpine3.24
    steps:
      - run: apk add --no-cache bash curl git py3-numpy py3-opencv

      - uses: actions/checkout@v4

      - run: curl -sSL https://dot.net/v1/dotnet-install.sh | bash -s -- --channel 10.0 --runtime dotnet --install-dir /usr/share/dotnet

      - run: python3 AcceleratedKAZE.Tests/Reference/generate.py

      - run: dotnet test AcceleratedKAZE.Tests/AcceleratedKAZE.Tests.csproj -c Release

      - run: dotnet test AcceleratedKAZE.Tests/AcceleratedKAZE.Tests.csproj -c Release --no-build
        env:
          DOTNET_EnableAVX: 0

  publish:
    needs: [test-windows, test-linux, test-alpine]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      - run: dotnet pack AcceleratedKAZE/AcceleratedKAZE.csproj -c Release -o ./nupkg

      - name: NuGet login (OIDC)
        uses: NuGet/login@v1
        id: login
        with:
          user: Meyn

      - run: dotnet nuget push ./nupkg/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
